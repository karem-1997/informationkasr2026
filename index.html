<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعلامات مستشفى القصر العيني الفرنساوي</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        /* تحسين السلايدر ليكون جاهزاً فوراً */
        #bg-slider { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #000; }
        #bg-slider img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.8s; }
        #bg-slider img.active { opacity: 1; }

        /* واجهة المستخدم - مع إضافة خلفية احتياطية */
        .main-overlay { position: relative; z-index: 5; height: 100vh; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.4); color: white; text-align: center; padding: 20px; }
        
        /* جعل العنوان يظهر فوراً */
        #display-title { font-size: clamp(1.5rem, 5vw, 3.5rem); margin-bottom: 30px; text-shadow: 0 4px 15px #000; opacity: 1; }
        #display-button { padding: 18px 60px; background: #00d2ff; color: #000; text-decoration: none; border-radius: 50px; font-weight: bold; font-size: 1.4rem; transition: 0.2s; }

        .secret-trigger { position: fixed; top: 0; left: 0; width: 60px; height: 60px; z-index: 9999; background: transparent; border: none; }
        #admin-panel { position: fixed; top: 0; right: 0; width: 320px; height: 100%; background: #111; color: white; z-index: 10000; padding: 25px; transform: translateX(100%); transition: 0.3s; overflow-y: auto; border-left: 3px solid #00d2ff; }
        #admin-panel.open { transform: translateX(0); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        .save-btn { width: 100%; padding: 15px; background: #27ae60; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .img-list-item { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; margin-top: 8px; padding: 8px; border-radius: 8px; }
        .img-list-item img { width: 50px; height: 40px; object-fit: cover; }
    </style>
</head>
<body>

    <button class="secret-trigger" onclick="checkAuth()"></button>

    <div id="admin-panel">
        <h3 style="color: #00d2ff;">⚙️ الإعدادات</h3>
        <input type="text" id="in-title" placeholder="تعديل العنوان">
        <input type="text" id="in-btn-txt" placeholder="نص الزر">
        <input type="text" id="in-btn-url" placeholder="رابط الزر">
        <input type="file" id="in-file" accept="image/*">
        <button class="save-btn" onclick="uploadConfig()">حفظ التعديلات</button>
        <hr style="border:0.5px solid #333; margin:20px 0;">
        <div id="manager-list"></div>
        <button onclick="document.getElementById('admin-panel').classList.remove('open')" style="margin-top:20px; background:none; border:none; color:gray; cursor:pointer; width:100%;">إغلاق ✖</button>
    </div>

    <div id="bg-slider"></div>

    <div class="main-overlay">
        <h1 id="display-title">استعلامات مستشفى القصر العيني الفرنساوي</h1>
        <a href="#" id="display-button">دخول</a>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAstAB3xRkY_qHqHLqUVN2UsGVzQ6h_faI",
            authDomain: "ali2020-ccb48.firebaseapp.com",
            projectId: "ali2020-ccb48",
            databaseURL: "https://ali2020-ccb48-default-rtdb.firebaseio.com",
            appId: "1:326754208529:web:d88705e9c06f988e511ab0"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function checkAuth() {
            if (prompt("الرمز السري:") === "1987") document.getElementById('admin-panel').classList.add('open');
        }

        function uploadConfig() {
            const file = document.getElementById('in-file').files[0];
            const upd = {};
            const t = document.getElementById('in-title').value;
            const bt = document.getElementById('in-btn-txt').value;
            const bu = document.getElementById('in-btn-url').value;

            if(t) upd['title'] = t;
            if(bt) upd['btnText'] = bt;
            if(bu) upd['btnLink'] = bu;
            
            db.ref('siteConfig').update(upd);

            if(file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    db.ref('imagesList').push(e.target.result).then(() => {
                        document.getElementById('in-file').value = "";
                        alert("تم رفع الصورة بنجاح ✅");
                    });
                };
                reader.readAsDataURL(file);
            } else { alert("تم حفظ التعديلات ✅"); }
        }

        function removeImage(key) {
            if(confirm("حذف الصورة؟")) db.ref('imagesList').child(key).remove();
        }

        // تحسين: جلب النصوص وعرضها فوراً
        db.ref('siteConfig').on('value', s => {
            const d = s.val();
            if(d) {
                if(d.title) document.getElementById('display-title').innerText = d.title;
                if(d.btnText) document.getElementById('display-button').innerText = d.btnText;
                if(d.btnLink) document.getElementById('display-button').href = d.btnLink;
            }
        });

        // تحسين: جلب الصور وعرضها فوراً
        db.ref('imagesList').on('value', s => {
            const imgs = s.val();
            const slider = document.getElementById('bg-slider');
            const manager = document.getElementById('manager-list');
            
            if(imgs) {
                let htmlSlider = "";
                let htmlManager = "";
                Object.keys(imgs).forEach((key, i) => {
                    const url = imgs[key];
                    htmlSlider += `<img src="${url}" class="${i === 0 ? 'active' : ''}">`;
                    htmlManager += `<div class="img-list-item"><img src="${url}"> <button onclick="removeImage('${key}')" style="background:red;color:white;border:none;padding:5px;border-radius:5px;cursor:pointer;">حذف</button></div>`;
                });
                slider.innerHTML = htmlSlider;
                manager.innerHTML = htmlManager;
            }
        });

        // حركة السلايدر
        let currentIdx = 0;
        setInterval(() => {
            const allSlides = document.querySelectorAll('#bg-slider img');
            if(allSlides.length < 2) return;
            allSlides[currentIdx].classList.remove('active');
            currentIdx = (currentIdx + 1) % allSlides.length;
            allSlides[currentIdx].classList.add('active');
        }, 3000);
    </script>
</body>
</html>
